[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.98"
license = "BUSL-1.1"
authors = ["boogvar"]
repository = "https://github.com/tessaridb/tessaridb-s3"
publish = false

[workspace.dependencies]
tessari-s3-constants = { path = "crates/tessari-s3-constants" }
tessari-s3-types = { path = "crates/tessari-s3-types" }
tessari-s3-core = { path = "crates/tessari-s3-core" }
tessari-s3-observability = { path = "crates/tessari-s3-observability" }
tessari-s3-infrastructure = { path = "crates/tessari-s3-infrastructure" }
tessari-s3-storage = { path = "crates/tessari-s3-storage" }
tessari-s3-api = { path = "crates/tessari-s3-api" }
tessari-s3-daemons = { path = "crates/tessari-s3-daemons" }

thiserror = "2"
anyhow = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
tower = { version = "0.5", features = ["limit", "load-shed", "util"] }
uuid = { version = "1", features = ["v4"] }
getrandom = "0.4"
tessaridb-client = "0.10"
quick-xml = "0.42"
hmac = "0.12"
sha2 = "0.10"
md-5 = "0.10"
sha1 = "0.10"
crc-fast = "1"
base64 = "0.22"
subtle = "2"
blake3 = "1"
reed-solomon-simd = "3"
futures-util = { version = "0.3", default-features = false }
# Internal shard traffic between S3 nodes; TLS arrives with the cluster CA (W7), so no TLS backend yet.
reqwest = { version = "0.13", default-features = false, features = ["stream"] }
bytes = "1"
zeroize = { version = "1", features = ["derive"] }
[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_docs = "warn"

[workspace.lints.clippy]
cast_possible_truncation = "deny"
cast_possible_wrap = "deny"
cast_sign_loss = "deny"
cast_precision_loss = "deny"
unwrap_used = "deny"
panic = "deny"
expect_used = "deny"
arithmetic_side_effects = "deny"
todo = "warn"
unimplemented = "warn"

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

[profile.dev]
debug = "line-tables-only"
opt-level = 0

[profile.dev.package."*"]
opt-level = 2

[profile.dev.build-override]
opt-level = 3
